name: Publish account-switching binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, 'unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Codex and Code Mode host
        working-directory: codex-rs
        run: cargo build --release -p codex-cli -p codex-code-mode-host --target ${{ matrix.target }}

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target }}/bin"
          cp "codex-rs/target/${{ matrix.target }}/release/codex${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.target }}/bin/"
          cp "codex-rs/target/${{ matrix.target }}/release/codex-code-mode-host${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.target }}/bin/"
          tar -czf "codex-${{ matrix.target }}.tar.gz" -C "dist/${{ matrix.target }}" bin

      - uses: actions/upload-artifact@v7
        with:
          name: codex-${{ matrix.target }}
          path: codex-${{ matrix.target }}.tar.gz

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: codex-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
